<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>UBCO 6DOF dashboard</title>
<style>
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --ink: #111111;
    --muted: #555;
    --line: #111;
    --green: #00c853;
    --red: #e53935;
    --orange: #d95319;
    --blue: #0072bd;
    --asphalt: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #track { width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  header {
    pointer-events: auto;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 14px 0 14px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .lap { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  button { pointer-events: auto; background: #fff; border: 2px solid #111; border-radius: 4px;
           padding: 4px 12px; cursor: pointer; font-weight: 600; }
  #cards {
    display: grid;
    grid-template-columns: 1.05fr 0.9fr 0.95fr 1.6fr;
    gap: 10px;
    padding: 8px 14px 0 14px;
    height: 42vh;
  }
  .card {
    background: var(--card);
    border: 3px solid #111;
    position: relative;
    overflow: hidden;
  }
  .card h2 {
    position: absolute; top: 4px; left: 8px; margin: 0;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #444;
  }
  .card canvas { width: 100%; height: 100%; display: block; }
  #mapbox {
    position: absolute; right: 16px; top: 46vh; width: 220px; height: 160px;
    background: transparent; pointer-events: none;
  }
  #clock {
    position: absolute; left: 16px; bottom: 12px;
    font-variant-numeric: tabular-nums; font-size: 14px; color: #111;
    background: rgba(255,255,255,0.85); padding: 4px 8px; border: 1px solid #111;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="track"></canvas></div>
<div id="overlay">
  <header>
    <div>
      <h1 id="title">HUD</h1>
      <div class="meta" id="subtitle"></div>
    </div>
    <div>
      <button id="play">Pause</button>
      <span class="lap" id="lap">0.000 s</span>
    </div>
  </header>
  <div id="cards">
    <div class="card"><h2>Vehicle / tires</h2><canvas id="carcard"></canvas></div>
    <div class="card"><h2>Driver</h2><canvas id="driver"></canvas></div>
    <div class="card"><h2>G-G</h2><canvas id="gg"></canvas></div>
    <div class="card"><h2>Telemetry</h2><canvas id="strip"></canvas></div>
  </div>
  <canvas id="mapbox"></canvas>
  <div id="clock"></div>
</div>
<script>
const D = __PAYLOAD__;
const N = D.time.length;
let playing = true, t0 = performance.now(), tSim = 0;
const CAM = D.camHeight || 72;

function lerp(a,b,u){ return a + (b-a)*u; }
function atTime(t){
  if (t <= D.time[0]) return 0;
  if (t >= D.time[N-1]) return N-1;
  let lo=0, hi=N-1;
  while (hi-lo>1){ const m=(lo+hi)>>1; if (D.time[m] <= t) lo=m; else hi=m; }
  return lo + (t - D.time[lo]) / Math.max(1e-9, D.time[hi]-D.time[lo]);
}
function samp(arr, f){
  const i = Math.max(0, Math.min(N-2, Math.floor(f)));
  return lerp(arr[i], arr[i+1], f-i);
}
function headingAt(f){
  const i = Math.max(0, Math.min(N-2, Math.floor(f)));
  const dx = D.x[i+1]-D.x[i], dy = D.y[i+1]-D.y[i];
  if (Math.hypot(dx,dy) < 1e-9) return samp(D.yaw, f);
  return Math.atan2(dy, dx);
}

function fit(c){
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, r.width * dpr);
  c.height = Math.max(1, r.height * dpr);
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:r.width, h:r.height};
}

function drawUbcoCar(ctx, delta){
  /* Nose along +X, metres. UBCO white / navy / carbon. */
  ctx.save();
  const wb = 1.62, track = 1.22, len = 3.15;
  const rr = {x:-0.55, y:-track/2}, rl = {x:-0.55, y: track/2};
  const fr = {x: wb-0.55, y:-track/2}, fl = {x: wb-0.55, y: track/2};

  function tire(p, steer){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(steer||0);
    ctx.fillStyle = '#111';
    ctx.fillRect(-0.28, -0.11, 0.56, 0.22);
    ctx.fillStyle = '#333';
    ctx.fillRect(-0.18, -0.07, 0.36, 0.14);
    ctx.restore();
  }
  tire(rr,0); tire(rl,0); tire(fr, delta); tire(fl, delta);

  /* floor / diffuser */
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-0.85, -0.62); ctx.lineTo(1.55, -0.55); ctx.lineTo(1.55, 0.55); ctx.lineTo(-0.85, 0.62);
  ctx.closePath(); ctx.fill();

  /* sidepods */
  ctx.fillStyle = '#0b1f4a';
  ctx.beginPath();
  ctx.moveTo(-0.15, -0.48); ctx.lineTo(1.05, -0.50); ctx.lineTo(1.20, -0.28); ctx.lineTo(0.15, -0.22);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-0.15, 0.48); ctx.lineTo(1.05, 0.50); ctx.lineTo(1.20, 0.28); ctx.lineTo(0.15, 0.22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1e4d8c';
  ctx.fillRect(0.05, -0.46, 0.85, 0.12);
  ctx.fillRect(0.05,  0.34, 0.85, 0.12);

  /* nose */
  ctx.fillStyle = '#f4f4f4';
  ctx.beginPath();
  ctx.moveTo(1.10, -0.22); ctx.lineTo(2.35, -0.09); ctx.lineTo(2.55, 0); ctx.lineTo(2.35, 0.09); ctx.lineTo(1.10, 0.22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0b1f4a';
  ctx.font = 'bold 0.28px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.translate(1.85, 0); ctx.rotate(Math.PI/2);
  ctx.fillText('1', 0, 0);
  ctx.restore();

  /* cockpit */
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(0.55, 0, 0.38, 0.20, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3d7ea6'; ctx.lineWidth = 0.05;
  ctx.beginPath(); ctx.moveTo(0.25, -0.12); ctx.lineTo(0.25, 0.12); ctx.stroke();

  /* rear wing */
  ctx.fillStyle = '#0b1f4a';
  ctx.fillRect(-1.05, -0.55, 0.18, 1.10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 0.11px sans-serif';
  ctx.save(); ctx.translate(-0.96, 0); ctx.rotate(-Math.PI/2);
  ctx.fillText('UBC OKANAGAN', 0, 0);
  ctx.restore();

  /* front wing */
  ctx.fillStyle = '#0b1f4a';
  ctx.fillRect(2.28, -0.62, 0.14, 1.24);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(2.20, -0.70, 0.28, 0.12);
  ctx.fillRect(2.20,  0.58, 0.28, 0.12);

  ctx.restore();
}

function drawTrack(f){
  const {ctx, w, h} = fit(track);
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(0,0,w,h);
  const x = samp(D.x,f), y = samp(D.y,f);
  const yaw = headingAt(f);
  const ppm = h / CAM;
  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.scale(ppm, -ppm);
  ctx.translate(-x, -y);

  /* asphalt ribbon */
  if (D.xl && D.xl.length){
    ctx.beginPath();
    ctx.moveTo(D.xl[0], D.yl[0]);
    for (let i=1;i<N;i++) ctx.lineTo(D.xl[i], D.yl[i]);
    for (let i=N-1;i>=0;i--) ctx.lineTo(D.xr[i], D.yr[i]);
    ctx.closePath();
    ctx.fillStyle = '#0d1117';
    ctx.fill();
  } else {
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = (D.halfWidth||3.5)*2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i=0;i<N;i++){ if(i) ctx.lineTo(D.x[i], D.y[i]); else ctx.moveTo(D.x[i], D.y[i]); }
    ctx.stroke();
  }

  /* dashed centerline */
  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 0.12;
  ctx.setLineDash([1.6, 1.4]);
  ctx.beginPath();
  for (let i=0;i<N;i++){ if(i) ctx.lineTo(D.x[i], D.y[i]); else ctx.moveTo(D.x[i], D.y[i]); }
  ctx.stroke();
  ctx.restore();

  /* throttle / brake trail */
  const i = Math.floor(f);
  const i0 = Math.max(0, i-220);
  ctx.lineCap = 'butt';
  ctx.lineWidth = 0.55;
  for (let k=i0;k<i;k++){
    const tps=D.tps[k], bps=D.bps[k];
    ctx.strokeStyle = tps>=bps ? `rgb(0,${Math.round(140+115*tps)},40)` : `rgb(${Math.round(160+95*bps)},20,20)`;
    ctx.beginPath(); ctx.moveTo(D.x[k], D.y[k]); ctx.lineTo(D.x[k+1], D.y[k+1]); ctx.stroke();
  }

  ctx.translate(x, y);
  ctx.rotate(yaw);
  ctx.scale(1.45, 1.45);
  drawUbcoCar(ctx, samp(D.delta,f)*Math.PI/180);
  ctx.restore();
}

function drawCarCard(f){
  const {ctx, w, h} = fit(document.getElementById('carcard'));
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  const names=['fl','fr','rl','rr'];
  const labels=['FL','FR','RL','RR'];
  const pos=[{x:0.62,y:0.28},{x:0.62,y:0.72},{x:0.28,y:0.28},{x:0.28,y:0.72}];
  ctx.save();
  ctx.translate(w*0.38, h*0.55);
  ctx.scale(h*0.22, -h*0.22);
  ctx.rotate(-Math.PI/2);
  drawUbcoCar(ctx, samp(D.delta,f)*Math.PI/180);
  ctx.restore();
  let fzMax = 1;
  for (const k of names) for (let i=0;i<N;i++) fzMax = Math.max(fzMax, D.fz[k][i]);
  names.forEach((k,i)=>{
    const fz = samp(D.fz[k],f);
    const p = samp(D.power[k],f)/1000;
    const e = samp(D.energy[k],f)/1e3;
    const u = fz/fzMax;
    const bx = pos[i].x*w + 8, by = pos[i].y*h - 40;
    const grd = ctx.createLinearGradient(bx, by+70, bx, by);
    grd.addColorStop(0,'#00c853'); grd.addColorStop(0.6,'#fdd835'); grd.addColorStop(1,'#e53935');
    ctx.fillStyle = '#eee'; ctx.fillRect(bx, by, 14, 70);
    ctx.strokeStyle = '#111'; ctx.strokeRect(bx, by, 14, 70);
    ctx.fillStyle = grd;
    ctx.fillRect(bx, by+70*(1-u), 14, 70*u);
    ctx.fillStyle = '#111'; ctx.font = '11px ui-monospace, monospace';
    ctx.fillText(labels[i], bx+18, by+12);
    ctx.fillText(`Fz ${fz.toFixed(0)} N`, bx+18, by+26);
    ctx.fillText(`P ${p.toFixed(1)} kW`, bx+18, by+40);
    ctx.fillText(`E ${e.toFixed(1)} kJ`, bx+18, by+54);
  });
}

function drawDriver(f){
  const {ctx, w, h} = fit(document.getElementById('driver'));
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  const tps = samp(D.tps,f), bps = samp(D.bps,f), steer = samp(D.steer,f);
  const barW = 28, barH = h*0.62, x0 = w*0.12, y0 = h*0.18;
  function bar(x, val, color, label){
    ctx.strokeStyle = '#111'; ctx.strokeRect(x, y0, barW, barH);
    ctx.fillStyle = color;
    ctx.fillRect(x, y0+barH*(1-val), barW, barH*val);
    ctx.fillStyle = '#111'; ctx.font = '11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(label, x+barW/2, y0+barH+16);
    ctx.fillText((val*100).toFixed(0)+'%', x+barW/2, y0-8);
  }
  bar(x0, bps, '#e53935', 'BPS');
  bar(x0+40, tps, '#00c853', 'TPS');
  const cx = w*0.72, cy = h*0.48, r = Math.min(w,h)*0.28;
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  const a = steer * Math.PI/180;
  ctx.strokeStyle = '#d95319'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.lineTo(cx + r*Math.sin(a), cy - r*Math.cos(a)); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(steer.toFixed(0)+'°', cx, cy+r+18);
}

function drawGG(f){
  const {ctx, w, h} = fit(document.getElementById('gg'));
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  const lim=2.2, cx=w/2, cy=h*0.52, sc=Math.min(w,h)*0.38/lim;
  const X=ay=>cx+ay*sc, Y=ax=>cy-ax*sc;
  ctx.strokeStyle='#bbb'; ctx.lineWidth=1;
  for (let g=0.5; g<=2.001; g+=0.5){
    ctx.beginPath(); ctx.arc(cx,cy,g*sc,0,Math.PI*2); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(cx-lim*sc,cy); ctx.lineTo(cx+lim*sc,cy);
  ctx.moveTo(cx,cy-lim*sc); ctx.lineTo(cx,cy+lim*sc); ctx.stroke();
  ctx.strokeStyle='#d95319'; ctx.lineWidth=1.5;
  if (D.envAy && D.envAy.length){
    const draw=(xs,ys)=>{ ctx.beginPath(); for(let i=0;i<xs.length;i++){ const x=X(xs[i]), y=Y(ys[i]); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);} ctx.stroke(); };
    draw(D.envAy, D.envAxMax); draw(D.envAy, D.envAxMin);
    draw(D.envAy.map(a=>-a), D.envAxMax); draw(D.envAy.map(a=>-a), D.envAxMin);
  }
  const i0 = Math.max(0, Math.floor(f)-50);
  ctx.strokeStyle='#00c853'; ctx.lineWidth=2; ctx.beginPath();
  for (let i=i0;i<=Math.floor(f);i++){ const x=X(D.ay[i]), y=Y(D.ax[i]); if(i===i0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();
  ctx.fillStyle='#00c853'; ctx.strokeStyle='#111';
  ctx.beginPath(); ctx.arc(X(samp(D.ay,f)), Y(samp(D.ax,f)), 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#555'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ay →', w-28, cy-6);
  ctx.fillText('ax', cx+12, 16);
}

function drawStrip(f){
  const {ctx, w, h} = fit(document.getElementById('strip'));
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,w,h);
  const tNow = samp(D.time,f), span=20;
  const tStart = tNow-span;
  ctx.strokeStyle='#2a2a2a';
  for (let k=0;k<=8;k++){
    const x=k/8*w, y=k/8*h;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  function nrm(arr){
    let lo=1e9, hi=-1e9;
    for (let i=0;i<N;i++){ if (D.time[i]>=tStart && D.time[i]<=tNow){ lo=Math.min(lo,arr[i]); hi=Math.max(hi,arr[i]); } }
    if (hi-lo<1e-9) return ()=>0.5;
    return x => (x-lo)/(hi-lo);
  }
  function trace(arr, color){
    const nn = nrm(arr);
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    let started=false;
    for (let i=0;i<N;i++){
      if (D.time[i]<tStart || D.time[i]>tNow) continue;
      const x = (D.time[i]-tStart)/span * w;
      const y = h - 8 - nn(arr[i])*(h-16);
      if (!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  trace(D.v, '#ff00ff');
  trace(D.steer, '#00ffff');
  trace(D.tps, '#00c853');
  trace(D.bps, '#ff3b30');
  const xNow = w-2;
  ctx.strokeStyle='#e53935'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(xNow,0); ctx.lineTo(xNow,h); ctx.stroke();
  ctx.fillStyle='#ddd'; ctx.font='11px sans-serif';
  ctx.fillText('speed', 8, 14); ctx.fillStyle='#ff00ff'; ctx.fillRect(52,5,18,8);
  ctx.fillStyle='#ddd'; ctx.fillText('steer', 80, 14); ctx.fillStyle='#00ffff'; ctx.fillRect(118,5,18,8);
  ctx.fillStyle='#ddd'; ctx.fillText('tps', 148, 14); ctx.fillStyle='#00c853'; ctx.fillRect(174,5,18,8);
  ctx.fillStyle='#ddd'; ctx.fillText('bps', 204, 14); ctx.fillStyle='#ff3b30'; ctx.fillRect(230,5,18,8);
}

function drawMini(f){
  const {ctx, w, h} = fit(document.getElementById('mapbox'));
  ctx.clearRect(0,0,w,h);
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for (let i=0;i<N;i++){ minx=Math.min(minx,D.x[i]); maxx=Math.max(maxx,D.x[i]);
    miny=Math.min(miny,D.y[i]); maxy=Math.max(maxy,D.y[i]); }
  const pad=16, sx=(w-2*pad)/Math.max(1e-6,maxx-minx), sy=(h-2*pad)/Math.max(1e-6,maxy-miny);
  const sc=Math.min(sx,sy);
  const X=x=>pad+(x-minx)*sc, Y=y=>h-pad-(y-miny)*sc;
  ctx.strokeStyle='#cfcfcf'; ctx.lineWidth=6; ctx.beginPath();
  for (let i=0;i<N;i++){ const x=X(D.x[i]), y=Y(D.y[i]); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }
  ctx.stroke();
  ctx.strokeStyle='#0072bd'; ctx.lineWidth=2; ctx.beginPath();
  for (let i=0;i<N;i++){ const x=X(D.x[i]), y=Y(D.y[i]); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }
  ctx.stroke();
  const px=X(samp(D.x,f)), py=Y(samp(D.y,f)), hd=headingAt(f);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-hd);
  ctx.fillStyle='#d95319'; ctx.strokeStyle='#111'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-7,6); ctx.lineTo(-3,0); ctx.lineTo(-7,-6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function frame(now){
  if (playing){
    tSim = (now - t0)/1000;
    if (tSim > D.lapTime){ tSim = tSim % D.lapTime; t0 = now - tSim*1000; }
  }
  const f = atTime(tSim);
  document.getElementById('clock').textContent =
    `t = ${tSim.toFixed(2)} s    ${(samp(D.v,f)*3.6).toFixed(1)} km/h    ax ${samp(D.ax,f).toFixed(2)} g    ay ${samp(D.ay,f).toFixed(2)} g`;
  drawTrack(f); drawCarCard(f); drawDriver(f); drawGG(f); drawStrip(f); drawMini(f);
  requestAnimationFrame(frame);
}

document.getElementById('title').textContent = D.vehicle + '  ·  ' + D.track;
document.getElementById('subtitle').textContent = 'World-aligned follow-cam  ·  6DOF-style dashboard (QSS channels)';
document.getElementById('lap').textContent = D.lapTime.toFixed(3) + ' s';
document.getElementById('play').onclick = () => {
  playing = !playing;
  document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
  if (playing) t0 = performance.now() - tSim*1000;
};
window.addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); document.getElementById('play').click(); }});
requestAnimationFrame(frame);
</script>
</body>
</html>
